services:
  db:
    image: postgres:16-alpine
    container_name: girokonto-db
    environment:
      POSTGRES_DB: girokonto
      POSTGRES_USER: girokonto
      POSTGRES_PASSWORD: girokonto
    ports:
      - "5438:5432"
    volumes:
      - girokonto-data:/var/lib/postgresql/data

  # Fängt alle Mails ab, nichts geht an echte Postfächer. Ansehen: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: girokonto-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  girokonto-data:
