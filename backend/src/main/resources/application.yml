spring:
  application:
    name: girokonto
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/girokonto}
    username: ${DB_USER:girokonto}
    password: ${DB_PASSWORD:girokonto}
  jpa:
    hibernate:
      ddl-auto: validate    # Schema kommt nur aus Flyway, Hibernate prüft nur
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}

app:
  mail:
    from: ${MAIL_FROM:no-reply@phd-kontor.local}
    code-minutes: 10       # so lange gilt ein Code
    resend-seconds: 60     # frühestens dann ein neuer Code
    max-attempts: 5        # Eingaben je Code
    # Schlüssel für den HMAC der Codes. Im Betrieb über CODE_SECRET setzen!
    code-secret: ${CODE_SECRET:nur-fuer-die-entwicklung-bitte-aendern}
  login:
    max-failed-attempts: 5
    lock-minutes: 5
