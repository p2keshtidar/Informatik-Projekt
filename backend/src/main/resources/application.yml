spring:
  application:
    name: girokonto
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/girokonto}
    username: ${DB_USER:girokonto}
    password: ${DB_PASSWORD:girokonto}
  jpa:
    hibernate:
      ddl-auto: validate    # Schema kommt nur aus Flyway, Hibernate prüft nur
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
