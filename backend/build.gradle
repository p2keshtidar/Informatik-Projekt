plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.frauas'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'        // REST-API, eingebauter Tomcat
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'   // Datenbankzugriff (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-validation' // @NotNull, @Size … an Eingaben
    implementation 'org.springframework.security:spring-security-crypto'      // BCrypt für Passwörter
    implementation 'org.springframework.boot:spring-boot-starter-mail'       // Codes per E-Mail (Mailpit)
    implementation 'org.flywaydb:flyway-core'                                // Datenbank-Migrationen
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'                                  // JDBC-Treiber

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}