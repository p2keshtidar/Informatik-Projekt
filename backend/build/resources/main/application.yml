spring:
  application:
    name: girokonto
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/girokonto}
    username: ${DB_USER:girokonto}
    password: ${DB_PASSWORD:girokonto}
  jpa:
    hibernate:
      ddl-auto: none        # Tabellen legt nur Flyway an, nie Hibernate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}